name: ci
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Test against a sproutboat-packages branch (a change that spans both repos): set the SPROUTBOAT_PACKAGES_REF
      # repository variable to the branch. Unset, the packages are the versions bun.lock pins. The checkout is a
      # hidden directory so `bun test` does not collect the packages' tests.
      - uses: actions/checkout@v7
        if: vars.SPROUTBOAT_PACKAGES_REF != ''
        with:
          repository: sproutboat/packages
          ref: ${{ vars.SPROUTBOAT_PACKAGES_REF }}
          path: .sproutboat-packages
      - name: Link the packages from ${{ vars.SPROUTBOAT_PACKAGES_REF }}
        if: vars.SPROUTBOAT_PACKAGES_REF != ''
        shell: bash
        run: |
          (cd .sproutboat-packages && bun install --frozen-lockfile)
          for name in runtime toolchain wire; do
            rm -rf "node_modules/@sproutboat/$name"
            ln -s "$PWD/.sproutboat-packages/packages/$name" "node_modules/@sproutboat/$name"
            echo "@sproutboat/$name -> $(bun -e "console.log(Bun.resolveSync('@sproutboat/$name', process.cwd()))")"
          done
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run examples:types
      - run: bun test

  # Every example under examples/ must run unchanged under workerd and typecheck against Cloudflare's types
  # (examples/workerd.ts). It is its own job so it runs beside `check` instead of inside `bun test`.
  examples-workerd:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Test against a sproutboat-packages branch (a change that spans both repos): set the SPROUTBOAT_PACKAGES_REF
      # repository variable to the branch. Unset, the packages are the versions bun.lock pins. The checkout is a
      # hidden directory so `bun test` does not collect the packages' tests.
      - uses: actions/checkout@v7
        if: vars.SPROUTBOAT_PACKAGES_REF != ''
        with:
          repository: sproutboat/packages
          ref: ${{ vars.SPROUTBOAT_PACKAGES_REF }}
          path: .sproutboat-packages
      - name: Link the packages from ${{ vars.SPROUTBOAT_PACKAGES_REF }}
        if: vars.SPROUTBOAT_PACKAGES_REF != ''
        shell: bash
        run: |
          (cd .sproutboat-packages && bun install --frozen-lockfile)
          for name in runtime toolchain wire; do
            rm -rf "node_modules/@sproutboat/$name"
            ln -s "$PWD/.sproutboat-packages/packages/$name" "node_modules/@sproutboat/$name"
            echo "@sproutboat/$name -> $(bun -e "console.log(Bun.resolveSync('@sproutboat/$name', process.cwd()))")"
          done
      - run: bun run examples:workerd

  runtime-conformance:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The toolchain caches: the patched Porffor source, SQLite and BearSSL
      # objects and the host uSockets build (~/.cache/sproutboat,
      # ~/.cache/porffor/deps), and Porffor's per-entry compiled C units
      # (~/.cache/porffor/build). Every entry is checked before it is used:
      # the first three against recorded sha256 digests and the exact compiler
      # command, the units byte for byte against freshly generated C and flags,
      # so a stale entry is rebuilt rather than trusted. Every binary is still
      # compiled and linked from scratch. The key carries the toolchain version
      # and the host C/C++ compiler's version, since the units are LTO objects
      # only that compiler can link. Not the runner image version: the
      # ubuntu-latest pool serves several images at once, and keying on it
      # missed the cache on a rerun of the same commit.
      - name: Compute the toolchain cache key
        id: cache-key
        shell: bash
        run: |
          toolchain="$(grep -oE '"@sproutboat/toolchain@[^"]+"' bun.lock | head -1 | tr -d '"')"
          test -n "$toolchain"
          compiler="$({ cc --version; c++ --version; } | sha256sum | cut -c1-16)"
          echo "prefix=toolchain-v2-${{ runner.os }}-${{ runner.arch }}-${toolchain}-cc${compiler}-" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/sproutboat
            !~/.cache/sproutboat/zig-*
            ~/.cache/porffor
          key: ${{ steps.cache-key.outputs.prefix }}${{ hashFiles('bun.lock', 'src/**', 'examples/**') }}
          restore-keys: ${{ steps.cache-key.outputs.prefix }}
      # Porffor prunes unit dirs unused for a week. A restored dir keeps its
      # old mtime, so mark it used now rather than have it pruned mid-run.
      - name: Mark restored Porffor unit dirs as used
        shell: bash
        run: if [ -d ~/.cache/porffor/build ]; then find ~/.cache/porffor/build -name flags -exec touch {} +; fi
      - run: bun install --frozen-lockfile
      # Test against a sproutboat-packages branch (a change that spans both repos): set the SPROUTBOAT_PACKAGES_REF
      # repository variable to the branch. Unset, the packages are the versions bun.lock pins. The checkout is a
      # hidden directory so `bun test` does not collect the packages' tests.
      - uses: actions/checkout@v7
        if: vars.SPROUTBOAT_PACKAGES_REF != ''
        with:
          repository: sproutboat/packages
          ref: ${{ vars.SPROUTBOAT_PACKAGES_REF }}
          path: .sproutboat-packages
      - name: Link the packages from ${{ vars.SPROUTBOAT_PACKAGES_REF }}
        if: vars.SPROUTBOAT_PACKAGES_REF != ''
        shell: bash
        run: |
          (cd .sproutboat-packages && bun install --frozen-lockfile)
          for name in runtime toolchain wire; do
            rm -rf "node_modules/@sproutboat/$name"
            ln -s "$PWD/.sproutboat-packages/packages/$name" "node_modules/@sproutboat/$name"
            echo "@sproutboat/$name -> $(bun -e "console.log(Bun.resolveSync('@sproutboat/$name', process.cwd()))")"
          done
      - run: bun run kitchen-sink
      - run: bun run kitchen-sink:standalone
      - run: bun run examples

  packaged-cli:
    name: packaged CLI (${{ matrix.name }})
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      matrix:
        include:
          # GitHub's hosted macOS pools are routinely starved (jobs cancelled after
          # ~15 min unacquired), so a pull request must not wait on them. On a
          # pull_request the macOS legs cross-build on Linux and only check the
          # Mach-O architecture; on push to main they run natively on macOS and
          # smoke-test the binary (the release workflows do the same before
          # publishing). The job names stay the same: the ruleset requires them.
          - name: macOS x64
            runner: macos-15
            dir: darwin-x64
            macho: x86_64
            # x64 is never run: the macOS image is arm64, so it is always cross-built and checked.
            always-cross: true
          - name: macOS arm64
            runner: macos-15
            dir: darwin-arm64
            macho: arm64
          - name: Linux x64
            runner: ubuntu-24.04
            dir: linux-x64
          - name: Linux arm64
            runner: ubuntu-24.04-arm
            dir: linux-arm64
    runs-on: ${{ github.event_name == 'pull_request' && startsWith(matrix.runner, 'macos') && 'ubuntu-24.04' || matrix.runner }}
    env:
      CROSS: ${{ matrix.always-cross == true || (github.event_name == 'pull_request' && startsWith(matrix.runner, 'macos')) }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Test against a sproutboat-packages branch (a change that spans both repos): set the SPROUTBOAT_PACKAGES_REF
      # repository variable to the branch. Unset, the packages are the versions bun.lock pins. The checkout is a
      # hidden directory so `bun test` does not collect the packages' tests.
      - uses: actions/checkout@v7
        if: vars.SPROUTBOAT_PACKAGES_REF != ''
        with:
          repository: sproutboat/packages
          ref: ${{ vars.SPROUTBOAT_PACKAGES_REF }}
          path: .sproutboat-packages
      - name: Link the packages from ${{ vars.SPROUTBOAT_PACKAGES_REF }}
        if: vars.SPROUTBOAT_PACKAGES_REF != ''
        shell: bash
        run: |
          (cd .sproutboat-packages && bun install --frozen-lockfile)
          for name in runtime toolchain wire; do
            rm -rf "node_modules/@sproutboat/$name"
            ln -s "$PWD/.sproutboat-packages/packages/$name" "node_modules/@sproutboat/$name"
            echo "@sproutboat/$name -> $(bun -e "console.log(Bun.resolveSync('@sproutboat/$name', process.cwd()))")"
          done
      - run: bun scripts/build-cli.ts --target ${{ matrix.dir }}
      - name: Check the cross-built macOS executable's architecture
        if: env.CROSS == 'true'
        shell: bash
        run: |
          cli="platform-packages/${{ matrix.dir }}/bin/sproutboat"
          test -x "$cli"
          file "$cli"
          file "$cli" | grep -q "Mach-O 64-bit ${{ matrix.macho }} executable" || { echo "not a Mach-O ${{ matrix.macho }} binary"; exit 1; }
      - name: Exercise the packaged executable with a cold host cache
        if: env.CROSS != 'true'
        shell: bash
        run: |
          cli="platform-packages/${{ matrix.dir }}/bin/sproutboat"
          test -x "$cli"
          "$cli" --version
          HOME="$RUNNER_TEMP/sproutboat-home" \
          SPROUTBOAT_TOOLCHAIN_CACHE="$RUNNER_TEMP/sproutboat-toolchain" \
          "$cli" build --target host examples/hello
          sprout="$(find examples/hello/.sproutboat/dist -type f -name sprout -print -quit)"
          test -x "$sprout"
          PORT=8791 "$sprout" >"$RUNNER_TEMP/sprout.log" 2>&1 &
          sprout_pid=$!
          trap 'kill "$sprout_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8791/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/sprout.log"
          exit 1
